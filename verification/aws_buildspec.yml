version: 0.2

phases:
  install:
    commands:
      - python --version
      - python -m pip install --upgrade pip
      - python -m pip install pytest

  build:
    commands:
      - python -m pytest -q

  post_build:
    commands:
      - python verification/run.py

artifacts:
  files:
    - verification-result.json
  discard-paths: no
